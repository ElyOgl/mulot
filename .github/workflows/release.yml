name: release

# Push a tag like `v0.2.0` to build every platform, attach the archives to a
# GitHub release and (when TAP_DEPLOY_KEY is set) bump the Homebrew tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "mulot $GITHUB_REF_NAME" --generate-notes --verify-tag

  build:
    needs: create-release
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="mulot-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/mulot.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
            archive="dist/$name.zip"
          else
            cp "target/${{ matrix.target }}/release/mulot" "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            archive="dist/$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sum=$(sha256sum "$archive"); else sum=$(shasum -a 256 "$archive"); fi
          echo "${sum%% *}  $(basename "$archive")" > "$archive.sha256"
          cat "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/mulot"
          "$bin" --version
          "$bin" --json --top 1 > /dev/null
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's API occasionally drops connections; don't fail a release over it.
          for attempt in 1 2 3 4; do
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber && exit 0
            echo "upload attempt $attempt failed, retrying" >&2
            sleep $((attempt * 15))
          done
          exit 1

  homebrew:
    needs: build
    runs-on: ubuntu-latest
    env:
      # Private half of a write deploy key that exists only on ElyOgl/homebrew-tap.
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v5
        if: env.TAP_DEPLOY_KEY != ''
      - name: Bump ElyOgl/homebrew-tap
        if: env.TAP_DEPLOY_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key && chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          mkdir -p sums && gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir sums
          git clone git@github.com:ElyOgl/homebrew-tap.git tap
          scripts/formula.sh "${GITHUB_REF_NAME#v}" sums > tap/Formula/mulot.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mulot.rb
          git commit -m "mulot ${GITHUB_REF_NAME#v}" || exit 0
          git push origin HEAD:main
